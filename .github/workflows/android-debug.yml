name: Android Debug APK # feature builds publish versioned test releases

on:
  push:
    branches: [ main, feature/subtitle-mask-merge-resume, feature/media-orientation-scan-v1.0.83 ]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: studio-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable debug signing key from repository secret
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_B64" || { echo 'Missing repository secret DEBUG_KEYSTORE_B64'; exit 1; }
          mkdir -p signing
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > signing/debug.keystore
          test -s signing/debug.keystore
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle assembleDebug
      - name: Validate APK structure, alignment, package and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 3
          echo "Checking VietASR native runtime libraries..."
          unzip -Z1 "$APK" | grep '^lib/arm64-v8a/libonnxruntime.so$'
          unzip -Z1 "$APK" | grep '^lib/arm64-v8a/libvietasr.so$'
          test "$(unzip -Z1 "$APK" | grep -c '^lib/arm64-v8a/libonnxruntime.so$')" -eq 1
          cp "$APK" app/build/outputs/apk/debug/COROS-DJI-Studio-1.0.78-rotation-metadata-cleared.apk
      - name: Upload Media orientation single-text result APK
        if: github.ref == 'refs/heads/feature/media-orientation-scan-v1.0.83'
        uses: actions/upload-artifact@v4
        with:
          name: COROS-DJI-Studio-1.0.86-orientation-single-text-result
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish Media orientation single-text result to GitHub Release
        if: github.ref == 'refs/heads/feature/media-orientation-scan-v1.0.83'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-v1.0.86-orientation-single-text-result
          name: COROS DJI Studio 1.0.86 - Orientation Single Text Result
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          overwrite_files: true
      - name: Publish subtitle and resumable merge test APK to isolated GitHub Release
        if: github.ref == 'refs/heads/feature/subtitle-mask-merge-resume'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rotation-metadata-cleared-v1.0.78
          name: COROS DJI Studio 1.0.78 - Rotation Metadata Cleared (Feature Test)
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/COROS-DJI-Studio-1.0.78-rotation-metadata-cleared.apk
          fail_on_unmatched_files: true
          overwrite_files: true
