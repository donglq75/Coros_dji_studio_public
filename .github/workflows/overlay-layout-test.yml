name: Overlay layout test APK

on:
  push:
    branches: [ feature/overlay-layout-v1.0.81, feature/overlay-render-controls-v1.0.82 ]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_B64" || { echo 'Missing repository secret DEBUG_KEYSTORE_B64'; exit 1; }
          mkdir -p signing
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > signing/debug.keystore
          test -s signing/debug.keystore
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle assembleDebug
      - name: Validate APK signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: COROS-DJI-Studio-overlay-render-controls-v1.0.82
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
